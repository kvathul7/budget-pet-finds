<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Pet Finds</title>
<meta name="description" content="Affordable & useful products for your pets.">
<meta name="theme-color" content="#e64a19">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%90%BE</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>🐾 BUDGET PET FINDS</h1>
    <p class="tagline">Affordable &amp; useful products for your pets 🛒</p>
  </header>

  <main class="container">
    <!-- The links are built here from products.js -->
    <div id="links" class="links"></div>

    <p id="empty-note" class="empty-note" hidden>
      No products yet — add some in <strong>products.js</strong>.
    </p>
  </main>

  <footer class="site-footer">
    <p>
      Some links on this page are Meesho creator/affiliate links.
      I may earn a commission from eligible purchases.
    </p>
  </footer>

  <!-- 1. Your product list -->
  <script src="products.js"></script>

  <!-- 2. Turns that list into tappable links.
          You should not need to touch anything below this line. -->
  <script>
  (function () {
    var box = document.getElementById('links');
    var PLACEHOLDER = 'PASTE_MEESHO_COMMISSION_LINK_HERE';

    if (typeof products === 'undefined' || !products.length) {
      document.getElementById('empty-note').hidden = false;
      return;
    }

    products.forEach(function (p) {
      var ready = p.link && p.link !== PLACEHOLDER;

      // A real link when one is set, otherwise a dead row that cannot be
      // tapped -- so the page never sends anyone to a broken page.
      var row = document.createElement(ready ? 'a' : 'div');
      row.className = 'link' + (ready ? '' : ' link--soon');

      if (ready) {
        row.href = p.link;
        row.target = '_blank';
        row.rel = 'noopener noreferrer';
      }

      var name = document.createElement('span');
      name.className = 'link-name';
      name.textContent = p.name;
      row.appendChild(name);

      var tail = document.createElement('span');
      tail.className = 'link-tail';
      tail.textContent = ready ? (p.price || '') : 'coming soon';
      row.appendChild(tail);

      box.appendChild(row);
    });
  })();
  </script>

</body>
</html>
